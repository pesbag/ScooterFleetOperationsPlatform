services:
  broker:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    ports: ["127.0.0.1:9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup.ps1 or configure .env first}
      MYSQL_DATABASE: stationDb
    ports: ["127.0.0.1:3306:3306"]
    volumes: [mysql_bike_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  mongo:
    image: mongo:8
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo_bike_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  processor:
    build:
      context: .
      dockerfile: ProcessingService/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Server=db;Port=3306;Database=stationDb;User=root;Password=${MYSQL_ROOT_PASSWORD};
      Kafka__BootstrapService: broker:29092
      Kafka__Consumer__BootstrapServers: broker:29092
      MongoDb__ConnectionString: mongodb://mongo:27017
      Redis__ConnectionString: redis:6379,abortConnect=false
    depends_on:
      db: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      broker: { condition: service_healthy }
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: BikeFleetOperationPlatform/Dockerfile
    environment:
      Kafka__BootstrapServices: broker:29092
      DataSource__StationPrefix: ${GBFS_STATION_PREFIX:-citibike:}
      DataSource__BaseUrl: ${GBFS_BASE_URL:-https://gbfs.lyft.com/gbfs/2.3/bkn/en/}
    depends_on:
      broker: { condition: service_healthy }
      processor: { condition: service_started }
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: StationApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ApiBaseUrl: http://localhost:8080
      Ui__RefreshSeconds: ${UI_REFRESH_SECONDS:-60}
      ConnectionStrings__DefaultConnection: Server=db;Port=3306;Database=stationDb;User=root;Password=${MYSQL_ROOT_PASSWORD};
      ConnectionStrings__OperationsConnection: Server=db;Port=3306;Database=fleetOperationsDb;User=root;Password=${MYSQL_ROOT_PASSWORD};
      MongoDb__ConnectionString: mongodb://mongo:27017
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      Redis__ConnectionString: redis:6379,abortConnect=false,connectTimeout=1000,asyncTimeout=1000,connectRetry=0
      DataSource__StationPrefix: ${GBFS_STATION_PREFIX:-citibike:}
      DataSource__BaseUrl: ${GBFS_BASE_URL:-https://gbfs.lyft.com/gbfs/2.3/bkn/en/}
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    volumes: [api_keys:/root/.aspnet/DataProtection-Keys]
    depends_on:
      db: { condition: service_healthy }
      mongo: { condition: service_healthy }
      processor: { condition: service_started }
    restart: unless-stopped

volumes:
  mysql_bike_data:
  mongo_bike_data:
  api_keys:
